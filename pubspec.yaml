name: androidstudioprojects
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # 🔥 LOCALIZACIÓN (IMPORTANTE)
  flutter_localizations:
    sdk: flutter

  shared_preferences: ^2.2.2

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  fl_chart: ^0.66.0

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2+1
  path: ^1.9.1

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 🔥 ACTIVAR GENERACIÓN DE IDIOMAS
  generate: true

  assets:
    - assets/images/mascota.png
    - assets/images/enojado.png
    - assets/images/triste.png